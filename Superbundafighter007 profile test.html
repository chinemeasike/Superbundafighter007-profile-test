<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SuperBundaFighter007</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
 * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background-color: #740027;
  font-family: 'Segoe UI', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 40px 20px;
}

.card {
  background-color: #fff;
  border-radius: 16px;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
  width: 100%;
  max-width: 500px;
  text-align: center;
  position: relative;
  overflow: hidden;
}

.card-header img {
  width: 100%;
  height: 200px;
  object-fit: cover;
}

.profile-img {
  position: absolute;
  top: 130px;
  left: 50%;
  transform: translateX(-50%);
  border-radius: 50%;
  border: 8px solid #fff;
  width: 160px;
  height: 160px;
  overflow: hidden;
  background-color: #fff;
}

.profile-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.card-body {
  padding: 120px 30px 30px;
}

.card-body h2 {
  font-size: 26px;
  font-weight: 700;
  color: #000;
  margin-bottom: 14px;
}

.card-body p {
  font-size: 17px;
  color: #555;
  line-height: 1.6;
}

.card-footer {
  padding: 20px 0 30px;
  display: flex;
  justify-content: center;
  gap: 30px;
}

.card-footer a {
  color: #e91e63;
  font-size: 24px;
  transition: color 0.3s ease;
}

.card-footer a:hover {
  color: #333;
}

/* 📱 Responsive enhancements */
@media (min-width: 768px) {
  .card {
    max-width: 600px;
  }

  .card-header img {
    height: 240px;
  }

  .profile-img {
    width: 180px;
    height: 180px;
    top: 150px;
  }

  .card-body {
    padding-top: 140px;
  }

  .card-body h2 {
    font-size: 30px;
  }

  .card-body p {
    font-size: 18px;
  }

  .card-footer a {
    font-size: 26px;
  }
}


  </style>
</head>
<body>

  <div class="card">
    <div class="card-header">
      <img src="https://art.ngfiles.com/images/5675000/5675713_756418_fomonomo_what-bunda-you-smokin-on.a20c18c1c88252621a757010cc3409b8.webp?f1715003890" alt="Background" />
    </div>
    <div class="profile-img">
      <img src="https://art.ngfiles.com/thumbnails/3895000/3895401_full.webp?f1715004041" alt="Profile">
    </div>
    <div class="card-body">

  hey 👋🏾 <br>

    superbundaworld.com 🔉🔊
  </a><br>
  business: <a href="mailto:superbundafighter007@gmail.com">superbundafighter007@gmail.com</a>
</p>

    </div>
    <div class="card-footer">
      <a href="#"><i class="fab fa-instagram"></i></a>
    </div>
  </div>

</body>
</html>
